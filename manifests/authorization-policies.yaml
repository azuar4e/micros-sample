apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: products-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: products
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/default/sa/orders-sa"
              - "cluster.local/ns/default/sa/apigw-sa"
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: orders-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: orders
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/default/sa/apigw-sa"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: apigw-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: apigw
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]