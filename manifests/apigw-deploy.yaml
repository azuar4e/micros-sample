apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: apigw
  name: apigw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigw
  strategy: {}
  template:
    metadata:
      labels:
        app: apigw
        ebpf-sec: enforce
    spec:
      containers:
      - image: azuar4e/apigw-ecom:v2
        name: apigw-ecom
