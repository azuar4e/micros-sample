apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: apigw
  name: apigw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigw
  strategy: {}
  template:
    metadata:
      labels:
        app: apigw
    spec:
      serviceAccountName: apigw-sa
      containers:
      - image: azuar4e/apigw-ecom:v14
        name: apigw-ecom
        envFrom:
          - secretRef:
              name: client-secret
