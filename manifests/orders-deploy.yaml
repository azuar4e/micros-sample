apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: orders
  name: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  strategy: {}
  template:
    metadata:
      labels:
        app: orders
        ebpf-sec: enforce
    spec:
      containers:
      - image: azuar4e/orders-svc:v5
        name: orders-svc