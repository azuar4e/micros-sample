apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: products
  name: products
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products
  strategy: {}
  template:
    metadata:
      labels:
        app: products
        ebpf-sec: enforce
    spec:
      containers:
      - image: azuar4e/products-svc:v3
        name: products-svc